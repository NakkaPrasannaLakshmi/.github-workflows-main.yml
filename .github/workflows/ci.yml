name: CI
on: [push]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with: { node-version: 18 }
      - run: npm i
      - run: npm test || true
      - run: echo "log" > log.txt && zip log.zip log.txt
      - uses: actions/upload-artifact@v3
        with: { name: artifact, path: log.zip }
